<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
    <!-- Navigation Bar -->

        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-bold">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <span class="text-xl font-bold">Blue Ridge CHC</span>
            </a>
            <nav class="hidden md:flex gap-4">
                <a href="index.html" class="px-3 py-1.5 rounded-xl font-medium text-teal-700 font-bold bg-teal-50">Home</a>
                <a href="team.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Meet the Team</a>
                <a href="services.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Services</a>
                <a href="contact.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Contact</a>
            </nav>
            <a href="contact.html" class="bg-teal-700 text-white px-5 py-2.5 rounded-full text-sm font-semibold">Book Appointment</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">

            <!-- Hero Section -->
            <section class="relative bg-gradient-to-b from-clinic-50/70 via-white to-surface py-16 lg:py-24 overflow-hidden border-b border-slate-100">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                        
                        <div class="lg:col-span-7 space-y-6">
                            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-clinic-100 text-clinic-800 text-xs font-semibold uppercase tracking-wider">
                                <span class="w-2 h-2 rounded-full bg-clinic-600 animate-pulse"></span>
                                Now Welcoming New Patients in Staunton, VA
                            </div>
                            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-neutralDark tracking-tight leading-[1.15]">
                                Equitable healthcare for every neighbor in the <span class="text-clinic-700">Blue Ridge.</span>
                            </h1>
                            <p class="text-lg sm:text-xl text-neutralMuted max-w-2xl font-normal leading-relaxed">
                                Blue Ridge Community Health Clinic provides comprehensive primary care, integrated mental health, and wellness outreach for families and individuals throughout Staunton and Augusta County — regardless of insurance status.
                            </p>
                            
                            <div class="flex flex-col sm:flex-row gap-4 pt-2">
                                <a href="contact.html" class="nav-link bg-clinic-700 hover:bg-clinic-800 text-white font-semibold px-8 py-4 rounded-full text-center shadow-lg shadow-clinic-700/20 hover:shadow-xl transition-all" data-page="contact">
                                    Book an Appointment
                                </a>
                                <a href="services.html" class="nav-link bg-white hover:bg-slate-50 text-neutralDark border border-slate-200 font-semibold px-8 py-4 rounded-full text-center shadow-sm hover:border-clinic-500 transition-all" data-page="services">
                                    Explore Clinic Services
                                </a>
                            </div>

                            <!-- Trust Badges -->
                            <div class="grid grid-cols-3 gap-4 pt-6 border-t border-slate-200/60 max-w-lg">
                                <div>
                                    <div class="text-2xl font-bold text-clinic-800">100%</div>
                                    <div class="text-xs text-neutralMuted">Sliding Fee Scale</div>
                                </div>
                                <div>
                                    <div class="text-2xl font-bold text-clinic-800">9+</div>
                                    <div class="text-xs text-neutralMuted">Licensed Providers</div>
                                </div>
                                <div>
                                    <div class="text-2xl font-bold text-clinic-800">English/ES</div>
                                    <div class="text-xs text-neutralMuted">Bilingual Support</div>
                                </div>
                            </div>
                        </div>

                        <!-- Hero Imagery -->
                        <div class="lg:col-span-5 relative">
                            <div class="relative mx-auto max-w-md lg:max-w-none">
                                <div class="relative overflow-hidden rounded-3xl shadow-2xl border-4 border-white bg-slate-100">
                                    <img src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&amp;fit=crop&amp;q=80&amp;w=1000" alt="Modern clinic greeting reception at Blue Ridge CHC" class="w-full h-[450px] object-cover object-center">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
                                    <div class="absolute bottom-6 left-6 right-6 text-white">
                                        <div class="flex items-center gap-2 mb-1">
                                            <i class="fa-solid fa-location-dot text-clinic-300"></i>
                                            <span class="text-sm font-semibold">Downtown Staunton Health Pavilion</span>
                                        </div>
                                        <p class="text-xs text-slate-200">412 N Augusta St, Staunton, VA 24401</p>
                                    </div>
                                </div>
                                
                                <!-- Floating Pill badge -->
                                <div class="absolute -top-4 -left-4 bg-white p-4 rounded-2xl shadow-xl border border-slate-100 flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg">
                                        <i class="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-semibold text-neutralDark">Medicaid &amp; Medicare</div>
                                        <div class="text-[11px] text-neutralMuted">Accepted alongside self-pay</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <!-- Clinic Pillars Overview -->
            <section class="py-20 bg-white">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="text-center max-w-3xl mx-auto mb-16">
                        <span class="text-clinic-600 font-semibold text-sm tracking-wider uppercase block mb-2">Our Community Mission</span>
                        <h2 class="text-3xl sm:text-4xl font-bold text-neutralDark tracking-tight">Rooted in Dignity, Access &amp; Excellence</h2>
                        <p class="text-neutralMuted mt-4 text-base sm:text-lg">
                            Blue Ridge Community Health Clinic exists to eliminate barriers to high quality physical and psychological wellbeing. We offer integrated care models that treat the whole person.
                        </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <!-- Pillar 1 -->
                        <div class="bg-surface p-8 rounded-3xl border border-slate-100 hover:border-clinic-200 hover:shadow-lg transition-all group">
                            <div class="w-14 h-14 rounded-2xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-2xl mb-6 group-hover:bg-clinic-700 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-stethoscope"></i>
                            </div>
                            <h3 class="text-xl font-bold text-neutralDark mb-3">Primary &amp; Preventative Care</h3>
                            <p class="text-neutralMuted text-sm leading-relaxed mb-4">
                                From routine wellness checkups and immunizations to acute sickness treatment and chronic disease monitoring, our medical team delivers lifelong care for patients of all ages.
                            </p>
                            <a href="services.html" class="nav-link text-clinic-700 font-semibold text-sm inline-flex items-center gap-1 group-hover:gap-2 transition-all" data-page="services">
                                Learn about Primary Care <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>

                        <!-- Pillar 2 -->
                        <div class="bg-surface p-8 rounded-3xl border border-slate-100 hover:border-clinic-200 hover:shadow-lg transition-all group">
                            <div class="w-14 h-14 rounded-2xl bg-skyClinic-100 text-skyClinic-700 flex items-center justify-center text-2xl mb-6 group-hover:bg-skyClinic-700 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-brain"></i>
                            </div>
                            <h3 class="text-xl font-bold text-neutralDark mb-3">Integrated Behavioral Health</h3>
                            <p class="text-neutralMuted text-sm leading-relaxed mb-4">
                                Our psychiatric nurse practitioners and licensed clinical social workers work alongside primary physicians to provide individual therapy, medication management, and crisis stabilization.
                            </p>
                            <a href="services.html" class="nav-link text-skyClinic-700 font-semibold text-sm inline-flex items-center gap-1 group-hover:gap-2 transition-all" data-page="services">
                                Explore Mental Health <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>

                        <!-- Pillar 3 -->
                        <div class="bg-surface p-8 rounded-3xl border border-slate-100 hover:border-clinic-200 hover:shadow-lg transition-all group">
                            <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl mb-6 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-hand-holding-hand"></i>
                            </div>
                            <h3 class="text-xl font-bold text-neutralDark mb-3">Community Advocacy &amp; Outreach</h3>
                            <p class="text-neutralMuted text-sm leading-relaxed mb-4">
                                Our dedicated outreach team conducts rural wellness screenings, connects families to transportation and food security assistance, and provides enrollment support for Medicaid and SNAP.
                            </p>
                            <a href="services.html" class="nav-link text-amber-700 font-semibold text-sm inline-flex items-center gap-1 group-hover:gap-2 transition-all" data-page="services">
                                Discover Community Work <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sliding Scale Highlight Banner -->
            <section class="py-16 bg-gradient-to-r from-clinic-800 to-clinic-900 text-white relative overflow-hidden">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                        <div class="lg:col-span-8 space-y-4">
                            <span class="px-3 py-1 bg-clinic-700 text-clinic-100 rounded-full text-xs font-semibold uppercase tracking-wider inline-block">
                                Financial Inclusivity Guarantee
                            </span>
                            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight">
                                Care is never denied based on an inability to pay.
                            </h2>
                            <p class="text-clinic-100/90 text-base sm:text-lg max-w-2xl">
                                Blue Ridge CHC provides a sliding fee discount scale based strictly on household size and verified income according to Federal Poverty Guidelines.
                            </p>
                        </div>
                        <div class="lg:col-span-4 flex flex-col sm:flex-row lg:flex-col gap-3">
                            <a href="contact.html" class="nav-link bg-white text-clinic-900 font-bold px-6 py-3.5 rounded-xl text-center hover:bg-clinic-50 transition-colors shadow-lg" data-page="contact">
                                Calculate Your Fee Tier
                            </a>
                            <a href="team.html" class="nav-link bg-clinic-700/60 hover:bg-clinic-700 text-white font-semibold px-6 py-3.5 rounded-xl text-center border border-clinic-600 transition-colors" data-page="team">
                                Meet Your Care Team
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Testimonial / Community Quote -->
            <section class="py-20 bg-surface">
                <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center space-y-6">
                    <i class="fa-solid fa-quote-left text-4xl text-clinic-300"></i>
                    <p class="text-xl sm:text-2xl font-medium text-neutralDark leading-relaxed italic">
                        "Having a community clinic right here in Staunton that looks at my diabetes, my depression, and my pharmacy costs in one coordinated visit changed our family's health forever."
                    </p>
                    <div class="pt-2">
                        <div class="font-bold text-neutralDark">Maria S. &amp; Family</div>
                        <div class="text-xs text-neutralMuted">Staunton, Virginia Residents since 2012</div>
                    </div>
                </div>
            </section>
        
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12 text-center text-sm border-t border-slate-800">

    </footer>
