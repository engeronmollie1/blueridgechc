<!DOCTYPE html>

                <span class="text-xl font-bold">Blue Ridge CHC</span>

            <nav class="hidden md:flex gap-4">

                <a href="team.html" class="px-3 py-1.5 rounded-xl font-medium text-teal-700 font-bold bg-teal-50">Meet the Team</a>

                <a href="contact.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Contact</a>

            <!-- Header Banner -->
            <div class="bg-white border-b border-slate-100 py-16">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center max-w-3xl">

                    <h1 class="text-4xl sm:text-5xl font-extrabold text-neutralDark tracking-tight">Meet Our Dedicated Providers</h1>
                    <p class="text-neutralMuted mt-4 text-base sm:text-lg">
                        At Blue Ridge CHC, our clinical staff combines Board-Certified Physicians, specialized Nurse Practitioners, Licensed Social Workers, and grassroots Outreach Officers working as a unified team.
                    </p>
                </div>
            </div>

            <!-- Team Grid Section -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-20">
                
                <!-- Category 1: Physicians (3 Providers) -->
                <div>

                        <div class="w-10 h-10 rounded-xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-user-doctor"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-neutralDark">Staff Physicians</h2>
                            <p class="text-xs text-neutralMuted">Board-Certified in Family Medicine, Internal Medicine, and Pediatrics</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">

                            <div class="p-6 flex-grow flex flex-col">

                                <h3 class="text-xl font-bold text-neutralDark">Dr. Julian Vance, MD</h3>
                                <p class="text-xs font-medium text-neutralMuted mb-3">Family Medicine &amp; Preventive Health</p>
                                <p class="text-neutralMuted text-sm leading-relaxed flex-grow">
                                    Dr. Vance earned his MD from the University of Virginia School of Medicine and completed his residency in Shenandoah Valley community health. He champions chronic metabolic management and evidence-based rural preventative healthcare.
                                </p>
                                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-neutralMuted">
                                    <span><i class="fa-solid fa-graduation-cap text-clinic-600 mr-1"></i> UVA School of Med</span>
                                    <span class="font-medium text-clinic-700">14 Yrs Experience</span>
                                </div>
                            </div>
                        </div>

                        <!-- Physician 2 -->
                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                            <img src="https://images.unsplash.com/photo-1594824813501-4838e2fae45f?auto=format&amp;fit=crop&amp;q=80&amp;w=700" alt="Dr. Anita Sharma, MD" class="w-full h-72 object-cover object-top">
                            <div class="p-6 flex-grow flex flex-col">
                                <span class="text-clinic-700 font-bold text-xs uppercase tracking-wider mb-1">Internal Medicine Specialist</span>
                                <h3 class="text-xl font-bold text-neutralDark">Dr. Anita Sharma, MD</h3>
                                <p class="text-xs font-medium text-neutralMuted mb-3">Cardiometabolic &amp; Geriatric Health</p>
                                <p class="text-neutralMuted text-sm leading-relaxed flex-grow">
                                    Specializing in hypertension, adult diabetes, and complex multi-system health conditions, Dr. Sharma brings over a decade of hospitalist and outpatient clinical care. She leads our sliding-scale senior wellness initiatives.
                                </p>
                                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-neutralMuted">
                                    <span><i class="fa-solid fa-graduation-cap text-clinic-600 mr-1"></i> VCU Health MCV</span>
                                    <span class="font-medium text-clinic-700">11 Yrs Experience</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                            <img src="https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&amp;fit=crop&amp;q=80&amp;w=700" alt="Dr. Carlos Morales, DO" class="w-full h-72 object-cover object-top">

                                <span class="text-clinic-700 font-bold text-xs uppercase tracking-wider mb-1">Pediatric &amp; Adolescent Care</span>

                                <p class="text-xs font-medium text-neutralMuted mb-3">Pediatrics &amp; Osteopathic Medicine</p>
                                <p class="text-neutralMuted text-sm leading-relaxed flex-grow">

                                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-neutralMuted">

                        <div class="w-10 h-10 rounded-xl bg-skyClinic-100 text-skyClinic-700 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-notes-medical"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-neutralDark">Nurse Practitioners</h2>
                            <p class="text-xs text-neutralMuted">Advanced Practice Registered Nurses delivering primary care &amp; mental wellness</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- NP 1 -->
                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col sm:flex-row">
                            <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&amp;fit=crop&amp;q=80&amp;w=600" alt="Sarah Jenkins, FNP-C" class="w-full sm:w-2/5 h-64 sm:h-auto object-cover object-top">
                            <div class="p-6 flex-grow flex flex-col justify-center">
                                <span class="text-skyClinic-700 font-bold text-xs uppercase tracking-wider mb-1">Family Nurse Practitioner</span>
                                <h3 class="text-xl font-bold text-neutralDark">Sarah Jenkins, FNP-C</h3>
                                <p class="text-xs font-medium text-neutralMuted mb-3">Women's Health &amp; Preventive Screenings</p>
                                <p class="text-neutralMuted text-sm leading-relaxed mb-4">

                                </p>
                                <div class="text-xs text-neutralMuted flex items-center gap-4">
                                    <span><i class="fa-solid fa-check-circle text-skyClinic-600 mr-1"></i> Certified Nurse Practitioner</span>
                                    <span><i class="fa-solid fa-heart text-rose-500 mr-1"></i> Women's Wellness</span>
                                </div>
                            </div>
                        </div>

                                <span class="text-skyClinic-700 font-bold text-xs uppercase tracking-wider mb-1">Psychiatric Mental Health NP</span>

                                    <span><i class="fa-solid fa-check-circle text-skyClinic-600 mr-1"></i> Board Certified PMHNP</span>
                                    <span><i class="fa-solid fa-brain text-clinic-600 mr-1"></i> Integrated Psychiatry</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex items-center gap-3 mb-8 pb-3 border-b border-slate-200">

                        <div>

                            <p class="text-xs text-neutralMuted">Compassionate psychotherapy, behavioral interventions, and trauma support</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- LCSW 1 -->
                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col sm:flex-row">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&amp;fit=crop&amp;q=80&amp;w=600" alt="Rachel Adams, LCSW" class="w-full sm:w-2/5 h-64 sm:h-auto object-cover object-top">

                                <span class="text-emerald-700 font-bold text-xs uppercase tracking-wider mb-1">Clinical Social Work Supervisor</span>
                                <h3 class="text-xl font-bold text-neutralDark">Rachel Adams, LCSW</h3>
                                <p class="text-xs font-medium text-neutralMuted mb-3">Cognitive Behavioral &amp; Trauma Therapy</p>
                                <p class="text-neutralMuted text-sm leading-relaxed mb-4">
                                    Rachel holds an MSW from James Madison University and has 12 years of clinical counseling experience. She facilitates individual psychotherapy for grief, chronic disease adjustment, and domestic trauma survivors.
                                </p>
                                <div class="text-xs text-neutralMuted flex items-center gap-3">
                                    <span><i class="fa-solid fa-ribbon text-emerald-600 mr-1"></i> EMDR Trained</span>
                                    <span><i class="fa-solid fa-users text-clinic-700 mr-1"></i> Adult Support Groups</span>
                                </div>
                            </div>
                        </div>

                        <!-- LCSW 2 -->
                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col sm:flex-row">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&amp;fit=crop&amp;q=80&amp;w=600" alt="Marcus Thorne, LCSW" class="w-full sm:w-2/5 h-64 sm:h-auto object-cover object-top">

                                </p>
                                <div class="text-xs text-neutralMuted flex items-center gap-3">
                                    <span><i class="fa-solid fa-hands-holding text-emerald-600 mr-1"></i> Harm Reduction</span>
                                    <span><i class="fa-solid fa-house-user text-clinic-700 mr-1"></i> Family Counseling</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                            <i class="fa-solid fa-bullhorn"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-neutralDark">Community Outreach Officers</h2>
                            <p class="text-xs text-neutralMuted">Grassroots health education, benefit enrollment, and rural patient navigation</p>

                    </div>

                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col sm:flex-row">
                            <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&amp;fit=crop&amp;q=80&amp;w=600" alt="Elena Rostova, MPH" class="w-full sm:w-2/5 h-64 sm:h-auto object-cover object-top">
                            <div class="p-6 flex-grow flex flex-col justify-center">
                                <span class="text-amber-700 font-bold text-xs uppercase tracking-wider mb-1">Director of Community Health</span>

                                <p class="text-neutralMuted text-sm leading-relaxed mb-4">

                                </p>
                                <div class="text-xs text-neutralMuted flex items-center gap-3">
                                    <span><i class="fa-solid fa-van-shuttle text-amber-600 mr-1"></i> Mobile Clinic Lead</span>
                                    <span><i class="fa-solid fa-chart-line text-clinic-700 mr-1"></i> Public Health (MPH)</span>
                                </div>

                        <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col sm:flex-row">
                            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;q=80&amp;w=600" alt="Kenneth Washington, BSW, CHW" class="w-full sm:w-2/5 h-64 sm:h-auto object-cover object-top">

                                <h3 class="text-xl font-bold text-neutralDark">Kenneth "Kenny" Washington, BSW, CHW</h3>
                                <p class="text-xs font-medium text-neutralMuted mb-3">Medicaid/SNAP Enrollment &amp; Housing Liaison</p>

            </div>
        
    </main>
