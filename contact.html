<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Ridge Community Health Clinic | CONTACT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-bold">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <span class="text-xl font-bold">Blue Ridge CHC</span>
            </a>
            <nav class="hidden md:flex gap-4">
                <a href="index.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Home</a>
                <a href="team.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Meet the Team</a>
                <a href="services.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Services</a>
                <a href="contact.html" class="px-3 py-1.5 rounded-xl font-medium text-teal-700 font-bold bg-teal-50">Contact</a>
            </nav>
            <a href="contact.html" class="bg-teal-700 text-white px-5 py-2.5 rounded-full text-sm font-semibold">Book Appointment</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">

            <!-- Header Banner -->
            <div class="bg-white border-b border-slate-100 py-16">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center max-w-3xl">
                    <span class="text-clinic-600 font-semibold text-sm tracking-wider uppercase block mb-2">Connect With Blue Ridge CHC</span>
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-neutralDark tracking-tight">Location, Hours &amp; Appointment Request</h1>
                    <p class="text-neutralMuted mt-4 text-base sm:text-lg">
                        We are conveniently located in downtown Staunton, Virginia. Use the form below to request an appointment, or call our care coordination desk directly.
                    </p>
                </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                    
                    <!-- Contact Information Column -->
                    <div class="lg:col-span-5 space-y-8">
                        <div>
                            <h2 class="text-2xl font-bold text-neutralDark mb-6">Clinic Information</h2>
                            
                            <div class="space-y-6">
                                <!-- Address -->
                                <div class="flex items-start gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-xl flex-shrink-0">
                                        <i class="fa-solid fa-location-dot"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-neutralDark text-base">Blue Ridge Health Pavilion</h3>
                                        <p class="text-neutralMuted text-sm">412 N Augusta St<br>Staunton, VA 24401</p>
                                        <p class="text-xs text-clinic-700 font-medium mt-1">Bus line accessible &amp; free patient parking in rear</p>
                                    </div>
                                </div>

                                <!-- Phone -->
                                <div class="flex items-start gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-xl flex-shrink-0">
                                        <i class="fa-solid fa-phone"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-neutralDark text-base">Telephone &amp; Fax</h3>
                                        <p class="text-neutralMuted text-sm">Main Office: <a href="tel:5408852300" class="text-clinic-700 font-semibold hover:underline">(540) 885-2300</a></p>
                                        <p class="text-neutralMuted text-sm">Clinical Fax: (540) 885-2309</p>
                                        <p class="text-xs text-neutralMuted mt-1">After-hours on-call physician reachable via main line</p>
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="flex items-start gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-xl flex-shrink-0">
                                        <i class="fa-solid fa-envelope"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-neutralDark text-base">General Inquiries</h3>
                                        <p class="text-neutralMuted text-sm">care@blueridgechc.org</p>
                                        <p class="text-xs text-neutralMuted mt-1">For urgent emergencies, please dial 911 immediately.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Hours of Operation Card -->
                        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 class="font-bold text-neutralDark text-base mb-4 flex items-center gap-2">
                                <i class="fa-regular fa-clock text-clinic-600"></i> Clinic Operating Hours
                            </h3>
                            <ul class="text-xs space-y-2.5">
                                <li class="flex justify-between py-1 border-b border-slate-50">
                                    <span class="text-neutralMuted">Monday &amp; Wednesday</span>
                                    <span class="font-bold text-neutralDark">8:00 AM – 7:00 PM (Extended)</span>
                                </li>
                                <li class="flex justify-between py-1 border-b border-slate-50">
                                    <span class="text-neutralMuted">Tuesday &amp; Thursday</span>
                                    <span class="font-bold text-neutralDark">8:00 AM – 5:00 PM</span>
                                </li>
                                <li class="flex justify-between py-1 border-b border-slate-50">
                                    <span class="text-neutralMuted">Friday</span>
                                    <span class="font-bold text-neutralDark">8:00 AM – 4:00 PM</span>
                                </li>
                                <li class="flex justify-between py-1 border-b border-slate-50">
                                    <span class="text-neutralMuted">Saturday (Walk-in Acute Clinic)</span>
                                    <span class="font-bold text-clinic-700">9:00 AM – 1:00 PM</span>
                                </li>
                                <li class="flex justify-between py-1">
                                    <span class="text-neutralMuted">Sunday</span>
                                    <span class="font-semibold text-rose-500">Closed (On-Call Provider Available)</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- Appointment Request Form Column -->
                    <div class="lg:col-span-7">
                        <div class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-100 shadow-xl">
                            <div class="mb-8">
                                <h2 class="text-2xl font-bold text-neutralDark">Request an Appointment</h2>
                                <p class="text-neutralMuted text-sm mt-1">
                                    Complete this confidential intake form. Our patient navigation coordinator will contact you by telephone within 1 business day to confirm your time.
                                </p>
                            </div>

                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label for="first_name" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">First Name *</label>
                                        <input type="text" id="first_name" required="" placeholder="e.g. Thomas" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                    </div>
                                    <div>
                                        <label for="last_name" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Last Name *</label>
                                        <input type="text" id="last_name" required="" placeholder="e.g. Jefferson" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label for="patient_phone" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Phone Number *</label>
                                        <input type="tel" id="patient_phone" required="" placeholder="(540) 555-0149" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                    </div>
                                    <div>
                                        <label for="patient_email" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Email Address *</label>
                                        <input type="email" id="patient_email" required="" placeholder="thomas@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label for="service_category" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Service Needed *</label>
                                        <select id="service_category" required="" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                            <option value="" disabled="" selected="">Select a primary reason...</option>
                                            <option value="Primary Care">Primary Medical Care / Physical</option>
                                            <option value="Chronic Care">Diabetes or High Blood Pressure Care</option>
                                            <option value="Mental Health">Behavioral Health / Therapy</option>
                                            <option value="Pediatrics">Pediatric &amp; Well-Child Visit</option>
                                            <option value="Sliding Scale">Benefits Enrollment / Sliding Scale Intake</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="provider_pref" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Provider Preference</label>
                                        <select id="provider_pref" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                            <option value="Next Available">First Available Provider</option>
                                            <option value="Dr. Julian Vance, MD">Dr. Julian Vance, MD (Family Med)</option>
                                            <option value="Dr. Anita Sharma, MD">Dr. Anita Sharma, MD (Internal Med)</option>
                                            <option value="Dr. Carlos Morales, DO">Dr. Carlos Morales, DO (Pediatrics - EN/ES)</option>
                                            <option value="Sarah Jenkins, FNP-C">Sarah Jenkins, FNP-C (Women's Health)</option>
                                            <option value="David Campbell, PMHNP">David K. Campbell, PMHNP (Psychiatry)</option>
                                            <option value="Rachel Adams, LCSW">Rachel Adams, LCSW (Therapy)</option>
                                            <option value="Kenny Washington, BSW">Kenny Washington (Patient Navigator)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <div>
                                        <label for="preferred_time" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Preferred Day &amp; Time</label>
                                        <select id="preferred_time" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                            <option value="Mornings (8am - 12pm)">Mornings (8:00 AM – 12:00 PM)</option>
                                            <option value="Afternoons (12pm - 4pm)">Afternoons (12:00 PM – 4:00 PM)</option>
                                            <option value="Evening (Wednesdays 5pm - 7pm)">Evening Extended (Wednesdays 5:00 PM – 7:00 PM)</option>
                                            <option value="Saturday Morning">Saturday Morning Walk-in</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="coverage_status" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Coverage / Insurance</label>
                                        <select id="coverage_status" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all">
                                            <option value="Sliding Fee / Uninsured">Uninsured / Interested in Sliding Scale</option>
                                            <option value="Virginia Medicaid">Virginia Medicaid (Anthem, Optima, etc.)</option>
                                            <option value="Medicare">Medicare / Medicare Advantage</option>
                                            <option value="Commercial Insurance">Private / Employer Insurance</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label for="intake_notes" class="block text-xs font-bold text-neutralDark uppercase tracking-wider mb-2">Notes or Accommodations (Optional)</label>
                                    <textarea id="intake_notes" rows="3" placeholder="Tell us if you need Spanish interpretation, wheelchair transit assistance, or have specific medical concerns..." class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-surface text-sm transition-all resize-none"></textarea>
                                </div>

                                <button type="submit" class="w-full bg-clinic-700 hover:bg-clinic-800 text-white font-bold py-4 rounded-xl shadow-lg shadow-clinic-700/20 hover:shadow-xl transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-paper-plane text-clinic-200"></i>
                                    <span>Submit Appointment Request</span>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12 text-center text-sm border-t border-slate-800">
        <p>&copy; 2026 Blue Ridge Community Health Clinic. 412 N Augusta St, Staunton, VA 24401 | (540) 885-2300</p>
    </footer>
</body>
</html>
