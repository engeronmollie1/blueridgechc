<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Ridge Community Health Clinic | SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-bold">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <span class="text-xl font-bold">Blue Ridge CHC</span>
            </a>
            <nav class="hidden md:flex gap-4">
                <a href="index.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Home</a>
                <a href="team.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Meet the Team</a>
                <a href="services.html" class="px-3 py-1.5 rounded-xl font-medium text-teal-700 font-bold bg-teal-50">Services</a>
                <a href="contact.html" class="px-3 py-1.5 rounded-xl font-medium text-slate-600 hover:text-teal-700">Contact</a>
            </nav>
            <a href="contact.html" class="bg-teal-700 text-white px-5 py-2.5 rounded-full text-sm font-semibold">Book Appointment</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">

            <!-- Header Banner -->
            <div class="bg-white border-b border-slate-100 py-16">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center max-w-3xl">
                    <span class="text-clinic-600 font-semibold text-sm tracking-wider uppercase block mb-2">Patient-Centered Medical Home</span>
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-neutralDark tracking-tight">Our Comprehensive Care Services</h1>
                    <p class="text-neutralMuted mt-4 text-base sm:text-lg">
                        We offer a complete continuum of primary medical care, mental health counseling, laboratory diagnostics, and patient assistance programs all under one roof in Staunton.
                    </p>
                </div>
            </div>

            <!-- Detailed Services Grid -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    
                    <!-- Service 1: Primary Care -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-clinic-100 text-clinic-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-user-doctor"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Comprehensive Primary Care</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Annual wellness exams, well-child visits, physicals for school and work, and timely care for acute conditions such as the flu, sinus infections, bronchitis, and minor cuts.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-clinic-600"></i> Routine Adult &amp; Pediatric Checkups</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-clinic-600"></i> Adult &amp; Childhood Immunizations</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-clinic-600"></i> On-Site Minor Wound Management</li>
                        </ul>
                    </div>

                    <!-- Service 2: Chronic Disease -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-rose-100 text-rose-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Chronic Disease Management</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Specialized disease stabilization protocols to help patients monitor and treat long-term illnesses, reducing costly hospitalizations and emergency visits.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-rose-600"></i> Diabetes (Type 1 &amp; 2) A1c Monitoring</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-rose-600"></i> Hypertension &amp; Cholesterol Control</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-rose-600"></i> Asthma &amp; COPD Respiratory Plans</li>
                        </ul>
                    </div>

                    <!-- Service 3: Mental Health -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-skyClinic-100 text-skyClinic-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-brain"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Integrated Behavioral Health</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Compassionate, non-judgmental counseling and psychiatric medication consultations delivered collaboratively with your primary physician in the same clinic visit.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-skyClinic-600"></i> Individual Cognitive Behavioral Therapy</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-skyClinic-600"></i> Depression &amp; Anxiety Medication Mgmt</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-skyClinic-600"></i> Substance Use Harm Reduction &amp; Support</li>
                        </ul>
                    </div>

                    <!-- Service 4: 340B Pharmacy Assistance -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-pills"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Prescription &amp; 340B Pharmacy</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Access deeply discounted medications through our federal 340B drug pricing program partnership, ensuring no patient abandons a critical prescription due to expense.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-emerald-600"></i> Sliding Scale Prescription Co-pays</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-emerald-600"></i> Free Medication Courier for Homebound</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-emerald-600"></i> Patient Assistance Program (PAP) Enrollment</li>
                        </ul>
                    </div>

                    <!-- Service 5: Outreach & Mobile Clinic -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-van-shuttle"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Rural Outreach &amp; Mobile Unit</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Our equipped mobile medical bus visits rural Augusta County communities, churches, and community centers, providing direct health screenings and enrollment clinics.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-amber-600"></i> Free Community Health Fairs &amp; Screenings</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-amber-600"></i> Medicaid / SNAP Benefits Application Aid</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-amber-600"></i> Spanish Language Interpretation Services</li>
                        </ul>
                    </div>

                    <!-- Service 6: Telehealth -->
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                        <div class="w-14 h-14 rounded-2xl bg-purple-100 text-purple-700 flex items-center justify-center text-2xl mb-6">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <h3 class="text-xl font-bold text-neutralDark mb-3">Virtual Telehealth Visits</h3>
                        <p class="text-neutralMuted text-sm leading-relaxed mb-6 flex-grow">
                            Secure, HIPAA-compliant video and telephone visits for patients with transportation barriers, allowing consultation with clinicians from the safety of home.
                        </p>
                        <ul class="text-xs text-neutralMuted space-y-2.5 pt-4 border-t border-slate-100">
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-purple-600"></i> Behavioral Health Tele-Counseling</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-purple-600"></i> Chronic Refill Evaluations</li>
                            <li class="flex items-center gap-2"><i class="fa-solid fa-check text-purple-600"></i> Zero App Download Required</li>
                        </ul>
                    </div>

                </div>

                <!-- Sliding Fee Details Banner -->
                <div class="mt-16 bg-clinic-50 rounded-3xl p-8 sm:p-12 border border-clinic-100 flex flex-col lg:flex-row items-center justify-between gap-8">
                    <div class="space-y-3 max-w-2xl">
                        <span class="text-clinic-800 text-xs font-bold uppercase tracking-wider bg-clinic-200/60 px-3 py-1 rounded-full">Understanding the Fee Scale</span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-neutralDark">Need help with healthcare costs?</h2>
                        <p class="text-neutralMuted text-sm sm:text-base leading-relaxed">
                            Bring proof of income (such as a recent pay stub, W-2, or social security letter) to your first appointment. Based on household size, primary care visits range from a nominal $15 fee to standard insurance copays.
                        </p>
                    </div>
                    <a href="contact.html" class="nav-link bg-clinic-700 hover:bg-clinic-800 text-white font-semibold px-8 py-4 rounded-full text-center whitespace-nowrap shadow-md" data-page="contact">
                        Review Eligibility with Kenny
                    </a>
                </div>
            </div>
        
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12 text-center text-sm border-t border-slate-800">
        <p>&copy; 2026 Blue Ridge Community Health Clinic. 412 N Augusta St, Staunton, VA 24401 | (540) 885-2300</p>
    </footer>
</body>
</html>
